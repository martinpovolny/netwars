<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NETWARS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23000'/%3E%3Cpath d='M8 2 L14 14 L2 14 Z' fill='%2335e04a'/%3E%3C/svg%3E" />
<style>
  :root {
    --amber: #ff2b2b;
    --green: #35e04a;
    --grid:  #d21f1f;
    --dim:   #7a1010;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { font-family: "DejaVu Sans Mono", "Courier New", monospace; color: var(--amber); }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  #hud {
    position: fixed; inset: 0; pointer-events: none;
    text-transform: uppercase; letter-spacing: 1px;
    text-shadow: 0 0 4px currentColor;
  }

  /* top-right: score + missiles */
  #tr { position: absolute; top: 14px; right: 20px; text-align: right; font-size: 15px; line-height: 1.5; }
  #tr .v { color: #ff8; }

  /* bottom-left: vertical gauges (Velocity / Shields) */
  #gauges { position: absolute; left: 20px; bottom: 20px; display: flex; gap: 14px; align-items: flex-end; }
  .gauge {
    position: relative; width: 26px; height: 150px;
    border: 2px solid var(--green); background: rgba(0,0,0,0.35);
  }
  .gauge .fill {
    position: absolute; left: 0; right: 0; bottom: 0; height: 0%;
    background: var(--amber); opacity: 0.85;
  }
  .gauge .lbl { position: absolute; left: 0; right: 0; top: -20px; text-align: center; color: var(--green); font-size: 13px; }

  /* centre: heading cross (where the nose points) + own-ship chevrons */
  #heading {
    position: absolute; left: 50%; top: 50%; width: 240px; height: 240px;
    transform: translate(-50%, -50%);
  }
  #heading .ship  { stroke: var(--green); stroke-width: 2.5; fill: none; opacity: 0.85; }
  #heading .cross { stroke: var(--amber); stroke-width: 2; }
  #heading .core  { fill: #f2f2f2; }

  /* deployed intent marker (chases the mouse with lag); ship turns toward it */
  #intent {
    position: absolute; left: 50%; top: 50%; width: 44px; height: 44px;
    margin: -22px 0 0 -22px; will-change: transform;
  }
  #intent path { stroke: #dfe7ef; stroke-width: 2; fill: none; }
  #intent rect { stroke: #dfe7ef; stroke-width: 2; fill: none; }

  /* raw mouse cursor: the tiny white rectangle */
  #mouse {
    position: absolute; left: 50%; top: 50%; width: 8px; height: 8px;
    margin: -4px 0 0 -4px; background: #fff; box-shadow: 0 0 4px #fff;
    will-change: transform;
  }

  #boost {
    position: absolute; top: 62px; right: 20px; color: var(--green);
    font-size: 14px; opacity: 0; border-bottom: 2px solid var(--green); padding-bottom: 2px;
    transition: opacity 0.15s;
  }
  #boost.on { opacity: 1; }

  /* top-centre objectives readout */
  #obj {
    position: absolute; left: 50%; top: 14px; transform: translateX(-50%);
    color: var(--amber); font-size: 13px; white-space: nowrap;
  }

  /* centre message */
  #msg {
    position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%);
    color: var(--green); font-size: 26px; opacity: 0; transition: opacity 0.25s;
  }
  #dead {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    display: none; text-align: center; color: var(--amber); font-size: 30px;
  }
  #dead small { display: block; margin-top: 10px; font-size: 15px; color: #ff8; }

  /* inset labels (viewports themselves are drawn by WebGL) */
  #axis-label  { position: absolute; left: 20px;  top: 156px; color: var(--green); font-size: 12px; }
  #radar-label { position: absolute; right: 20px; bottom: 196px; color: var(--grid); font-size: 12px; }

  #help {
    position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%);
    color: #ff8; font-size: 12px; opacity: 0.9; white-space: nowrap;
  }
  #help.hidden { display: none; }
</style>
</head>
<body>
<canvas id="view"></canvas>

<div id="hud">
  <div id="tr">
    <div>Score: <span class="v" id="score">000000</span></div>
    <div>Missiles: <span class="v" id="missiles">20</span></div>
  </div>

  <div id="gauges">
    <div class="gauge"><div class="fill" id="vel-fill"></div><span class="lbl">V</span></div>
    <div class="gauge"><div class="fill" id="shd-fill"></div><span class="lbl">S</span></div>
  </div>

  <svg id="heading" viewBox="-120 -120 240 240">
    <!-- own-ship chevrons arranged radially (as in NetWars) -->
    <g class="ship">
      <polyline points="-46,-14 -30,0 -46,14" />
      <polyline points="46,-14 30,0 46,14" />
      <polyline points="-14,-46 0,-30 14,-46" />
      <polyline points="-14,46 0,30 14,46" />
    </g>
    <!-- heading cross: where the nose is pointing -->
    <g class="cross">
      <line x1="-16" y1="0" x2="-5" y2="0" />
      <line x1="16" y1="0" x2="5" y2="0" />
      <line x1="0" y1="-16" x2="0" y2="-5" />
      <line x1="0" y1="16" x2="0" y2="5" />
    </g>
    <circle class="core" cx="0" cy="0" r="2.5" />
  </svg>

  <svg id="intent" viewBox="-22 -22 44 44">
    <path d="M -20 -10 L -20 -20 L -10 -20" />
    <path d="M 20 -10 L 20 -20 L 10 -20" />
    <path d="M -20 10 L -20 20 L -10 20" />
    <path d="M 20 10 L 20 20 L 10 20" />
    <rect x="-5" y="-5" width="10" height="10" />
  </svg>

  <div id="mouse"></div>
  <div id="boost">Extra Thrust</div>

  <div id="obj">Level 1</div>
  <div id="msg"></div>
  <div id="dead">Ship Destroyed<small>press R to respawn</small></div>

  <div id="axis-label">Orientation</div>
  <div id="radar-label">Scanner</div>

  <div id="help">Click to fly &nbsp;·&nbsp; Mouse aim &nbsp;·&nbsp; W/S throttle &nbsp;·&nbsp; A/D roll &nbsp;·&nbsp; Shift boost &nbsp;·&nbsp; C brake &nbsp;·&nbsp; Space fire</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.169.0/three.module.min.js"
  }
}
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
